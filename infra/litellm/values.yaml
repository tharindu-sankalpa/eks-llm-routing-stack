# Helm values for the LiteLLM proxy (chart: repos/litellm/helm/litellm-helm, version 1.1.3).
# Secrets are NOT in this file. They are created with kubectl from .env before
# the install (see docs/setup-guide.md).

image:
  repository: ghcr.io/berriai/litellm
  # The chart's default tag is its appVersion (v1.85.1). Pin the release that
  # matches the source checkout (pyproject.toml version 1.104.0).
  tag: v1.104.0
  pullPolicy: IfNotPresent

# Master key: read from an existing Secret instead of letting the chart generate one.
masterkeySecretName: litellm-masterkey
masterkeySecretKey: masterkey

# Extra environment loaded with envFrom. The Secret holds LITELLM_SALT_KEY, the
# key LiteLLM uses to encrypt provider API keys before writing them to Postgres.
# The chart has no value for it; without it the master key is used as the salt.
environmentSecrets:
  - litellm-env

envVars:
  # Required for POST /model/new: models (and their encrypted credentials) are
  # stored in Postgres instead of config.yaml.
  STORE_MODEL_IN_DB: "True"

# Rendered as /etc/litellm/config.yaml. No models here on purpose: every model,
# MCP server and agent is registered at runtime through the REST API.
proxy_config:
  model_list: []
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true

# Bundled single-node Postgres (Bitnami subchart 14.3.1, vendored in the chart).
# Passwords are passed with --set at install time, from .env.
db:
  deployStandalone: true
  useExisting: false

postgresql:
  primary:
    persistence:
      size: 8Gi # uses the default StorageClass (gp3)

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi
